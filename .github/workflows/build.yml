name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android iskeletini olustur (kodumuzu koruyarak)
        run: |
          mkdir -p /tmp/keep/lib
          if [ -d lib ]; then cp -r lib/. /tmp/keep/lib/; else cp ./*.dart /tmp/keep/lib/; fi
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --platforms=android --project-name iptv_app --org com.benim .
          rm -rf lib
          mkdir lib
          cp /tmp/keep/lib/*.dart lib/
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      - name: Manifest ayarlari (uygulama adi, internet, http izni)
        run: |
          APP_NAME=$(cat app_name.txt 2>/dev/null || echo IPTV)
          M=android/app/src/main/AndroidManifest.xml
          sed -i "s#android:label=\"[^\"]*\"#android:label=\"$APP_NAME\"#" $M
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i '0,/<activity/s#<activity#<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>\n        <activity#' $M
          grep -n "EnableImpeller\|usesCleartextTraffic\|INTERNET" $M

      - run: flutter pub get

      - name: Uygulama ikonu
        run: |
          mkdir -p assets
          cp icon.png icon_fg.png assets/
          dart run flutter_launcher_icons

      - name: Lint denetimini atla (video_player lint cokmesi)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.toLowerCase().contains('lintvital')) {
                t.enabled = false
              }
            }
          }
          EOF

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: iptv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
