name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android iskeletini olustur (kodumuzu koruyarak)
        run: |
          mkdir -p /tmp/keep/lib
          if [ -d lib ]; then cp -r lib/. /tmp/keep/lib/; else cp ./*.dart /tmp/keep/lib/; fi
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --platforms=android --project-name iptv_app --org com.benim .
          rm -rf lib
          mkdir lib
          cp /tmp/keep/lib/*.dart lib/
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      - name: Manifest ayarlari (uygulama adi, internet, http izni)
        run: |
          APP_NAME=$(cat app_name.txt 2>/dev/null || echo IPTV)
          M=android/app/src/main/AndroidManifest.xml
          sed -i "s#android:label=\"[^\"]*\"#android:label=\"$APP_NAME\"#" $M
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i '0,/<activity/s#<activity#<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>\n        <activity#' $M
          sed -i 's#<activity#<activity android:supportsPictureInPicture="true"#' $M
          grep -n "supportsPictureInPicture\|usesCleartextTraffic\|INTERNET" $M

      - name: MainActivity (resim icinde resim)
        run: |
          F=$(find android/app/src/main -name 'MainActivity.*' | head -1)
          PKG=$(grep -m1 '^package ' "$F" | sed 's/package //')
          rm -f "$F"
          D=android/app/src/main/kotlin/$(echo "$PKG" | tr . /)
          mkdir -p "$D"
          cat > "$D/MainActivity.kt" <<EOF
          package $PKG

          import android.app.PictureInPictureParams
          import android.content.res.Configuration
          import android.os.Build
          import android.util.Rational
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var pipEnabled = false
              private var channel: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val ch = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "ryiptv/pip")
                  channel = ch
                  ch.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "setEnabled" -> {
                              pipEnabled = (call.arguments as? Boolean) ?: false
                              result.success(null)
                          }
                          "enter" -> {
                              enterPip()
                              result.success(null)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun enterPip() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val params = PictureInPictureParams.Builder()
                          .setAspectRatio(Rational(16, 9))
                          .build()
                      enterPictureInPictureMode(params)
                  }
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (pipEnabled) enterPip()
              }

              override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  channel?.invokeMethod("pip", isInPictureInPictureMode)
              }
          }
          EOF

      - run: flutter pub get

      - name: Uygulama ikonu
        run: |
          mkdir -p assets
          cp icon.png icon_fg.png assets/
          dart run flutter_launcher_icons

      - name: Lint denetimini atla (video_player lint cokmesi)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.toLowerCase().contains('lintvital')) {
                t.enabled = false
              }
            }
          }
          EOF

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: iptv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
