name: iptv_app
description: Kisisel IPTV oynatici (M3U + Xtream)
publish_to: "none"
version: 2.3.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  crypto: ^3.0.3
  cached_network_image: ^3.3.1
  video_player: ^2.8.0
  chewie: ^1.7.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0B0B12"
  adaptive_icon_foreground: "assets/icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
